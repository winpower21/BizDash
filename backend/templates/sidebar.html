<script>
	function toggleSidebar() {
		const sidebar = document.getElementById("sidebar");
		sidebar.classList.toggle("collapsed");
		// Close all open submenus when collapsing sidebar
		if (sidebar.classList.contains("collapsed")) {
			const openMenus = document.querySelectorAll(".submenu.show");
			openMenus.forEach((menu) => {
				const bsCollapse = bootstrap.Collapse.getInstance(menu);
				if (bsCollapse) {
					bsCollapse.hide();
				}
			});
		}
	}
	function expandSidebar() {
		const sidebar = document.getElementById("sidebar");
		// Only expand if sidebar is currently collapsed
		if (sidebar.classList.contains("collapsed")) {
			sidebar.classList.remove("collapsed");
		}
	}

	// Ensure Bootstrap collapse is properly initialized
	document.addEventListener("DOMContentLoaded", function () {
		// Get all collapse toggle links
		const collapseToggles = document.querySelectorAll(
			'[data-bs-toggle="collapse"]',
		);

		collapseToggles.forEach((toggle) => {
			toggle.addEventListener("click", function (e) {
				e.preventDefault();

				const targetId = this.getAttribute("href");
				const targetElement = document.querySelector(targetId);

				if (targetElement) {
					const bsCollapse =
						bootstrap.Collapse.getOrCreateInstance(targetElement);
					bsCollapse.toggle();
				}
			});
		});
	});
	document.addEventListener("DOMContentLoaded", () => {
		// Find all alerts
		const alerts = document.querySelectorAll(".alert");
		alerts.forEach((alertElement) => {
			// Create a Bootstrap Alert instance for each alert
			const bsAlert = new bootstrap.Alert(alertElement);
			// Delay for 3 seconds before starting the fade-out
			setTimeout(() => {
				bsAlert.close();
			}, 4000);
		});
	});
</script>
