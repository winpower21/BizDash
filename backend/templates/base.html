<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<title>{% block title %}{% endblock %}</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='style.css') }}"
		/>
		{% block style %} 
		{% endblock %}
	</head>
	<body>
		<div class="d-flex">
			{% include 'sidebar.html' %}
			
			<div class="content">
				{% with messages = get_flashed_messages(with_categories=true) %} 
					{% if messages %} 
						{% for category, message in messages %}
							<div class="alert alert-{{ 'danger' if category == 'error' else category }} d-flex align-items-center fade show" role="alert">
								<span class="flex-grow-1"> {{ message }} </span>
								<button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
							</div>
						{% endfor %} 
					{% endif %} 
				{% endwith %}
			
				{% block content %} 
				{% endblock %}
			</div>
		</div>
		
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
<script>    
	document.addEventListener("DOMContentLoaded", () => {
		// Find all alerts
		const alerts = document.querySelectorAll(".alert");
		alerts.forEach((alertElement) => {
			// Create a Bootstrap Alert instance for each alert
			const bsAlert = new bootstrap.Alert(alertElement);
			// Delay for 3 seconds before starting the fade-out
			setTimeout(() => {
				bsAlert.close();
			}, 4000);
		});
	});
</script>
