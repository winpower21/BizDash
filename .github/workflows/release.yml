name: Tauri Build & Release

on:
  push:
    tags:
      - "v*"

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node (Vite + Tauri CLI)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Rust (required by Tauri)
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 4. Setup Python (required for PyInstaller backend)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      # 5. Linux system libraries required by Tauri bundler
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # 6. Install frontend dependencies
      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      # 7. Build Tauri app (this runs build-backend.mjs automatically)
      - name: Build Tauri application
        working-directory: frontend
        run: npx tauri build

      # 8. Upload installers as artifacts (NOT to release yet)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.os }}
          path: | 
            frontend/src-tauri/target/release/bundle/**/*.msi 
            frontend/src-tauri/target/release/bundle/**/*.exe 
            frontend/src-tauri/target/release/bundle/**/*.AppImage 
            frontend/src-tauri/target/release/bundle/**/*.deb 

  release:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Upload installers to the GitHub Release
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}